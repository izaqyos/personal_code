[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bug-triage"
version = "0.1.0"
description = "Mock 3-tier bug-triage agent (TF-IDF, LLM judge, final LLM) over fully invented data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.7"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
bug-triage = "bug_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bug_triage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs local Ollama and the claude CLI (skipped by default)"]
addopts = '-m "not live" --cov=bug_triage --cov-report=term-missing --cov-fail-under=90'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "google.*"]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
