[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aireview"
version = "0.1.0"
description = "Harness-agnostic AI code review: shared instructions + LLM wiki + deterministic guardrails"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aireview = "aireview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aireview = ["payload/**/*", "payload/**/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RET", "PL", "RUF"]
ignore = ["PLR2004", "PLR0913", "PLR0911", "PLR0912", "PLR0915", "PLC0415", "RUF001"]
