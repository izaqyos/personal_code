# craft wiki catalog: every candidate source, its grade, and where it is routed.
# Grades: A exemplar (full) · B ok (only `use` sections) · C weak · D legacy (C/D not routed).
# Edit this file, then: python3 wiki/audit.py render && python3 wiki/audit.py check
audited = "2026-11-03"

[roots]
KB = "~/work/git/personal_KB"
CODE = "~/work/git/personal_code"
PRACTICE = "~/work/practice"
SUITE = "."

[routes]
ai-collab = "any phase: how to drive the AI (plan, gates, decisions, verification)"
design = "frame: API contract, data model, trade-offs, design note"
resilience = "timeouts, retries, circuit breakers, idempotency, availability, failure modes"
performance = "latency budgets, complexity, concurrency, profiling, benchmarks"
scalability = "statelessness, caching, queues, partitioning, backpressure"
rate-limiting = "token bucket / sliding window, quotas, 429 handling"
security = "input validation, injection, secrets, authz, deserialization, supply chain"
extensibility = "seams, events, sagas, provider-agnostic layers, config over code"
observability = "structured logs, metrics, traces, correlation ids, health checks"
testing = "test strategy, fakes, property tests, fault injection, contract tests"
python = "Python idioms, typing, asyncio, logging, tooling"
typescript-node = "TypeScript/Node idioms, strict typing, async, streams, tooling"
llm-apps = "code that calls LLMs: cost, latency, determinism, evals, guardrails"

