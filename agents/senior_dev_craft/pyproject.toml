[project]
name = "senior-dev-craft"
version = "0.1.0"
description = "Claude Code skill suite: senior-engineer coding loop grounded in an audited personal wiki"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RET", "PL", "RUF"]
ignore = ["PLR2004", "PLR0913", "S603"]
