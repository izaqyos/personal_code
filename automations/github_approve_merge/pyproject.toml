[project]
name = "github-approve-merge"
version = "0.1.0"
description = "CLI that approves and merges GitHub PRs in batch via the gh API."
requires-python = ">=3.12"
authors = [{name = "Yosi Izaq", email = "me@example.com"}]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
gh-approve-merge = "github_approve_merge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_approve_merge"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "live: requires PYTEST_LIVE=1 and a real PR URL (not run in CI)",
]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
